name: Quasi Atlas G0 CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  scientific-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Test analytic fixtures and evidence contract
        run: npm test
      - name: Build static site
        run: npm run build
      - name: Ensure no credentials in built bundle
        shell: bash
        run: |
          if grep -R -l -E '(AWS_SECRET_ACCESS_KEY|NEON_API_KEY|VERCEL_API_TOKEN|CLOUDFLARE_API_TOKEN)' dist; then
            echo "Sensitive variable key detected in build output" >&2
            exit 1
          fi
